name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: cd admin && npm ci

      - name: Type-check worker
        run: npx tsc --noEmit

      - name: Type-check admin
        run: cd admin && npx vue-tsc --noEmit

      # Build the admin SPA before tests: vitest-pool-workers loads
      # wrangler.toml, whose [assets] directory = "./dist" must exist or
      # Miniflare's config validation throws.
      - name: Build admin SPA
        run: npm run admin:build

      - name: Run tests
        run: npm test

      - name: Dry-run deploy
        run: npm run build

  # The MCP server is a separate workspace (mcp-server/). Run its type-check and
  # tests in their own job so they report independently of the main worker job.
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Type-check MCP server
        run: npm run typecheck --workspace mcp-server

      - name: Run MCP server tests
        run: npm test --workspace mcp-server

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: cd admin && npm ci

      - name: Build admin SPA
        run: npm run admin:build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
