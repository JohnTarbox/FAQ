name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: cd admin && npm ci

      - name: Type-check worker
        run: npx tsc --noEmit

      - name: Type-check admin
        run: cd admin && npx vue-tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build admin SPA
        run: npm run admin:build

      - name: Dry-run deploy
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: cd admin && npm ci

      - name: Build admin SPA
        run: npm run admin:build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
